<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JenSoo Profile Card</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Card Profile Picture -->
    <div class="card" id="card">
        <img id="profileImg" src="https://i.mydramalist.com/LwQ5Ny_5c.jpg" alt="Profile Pic">

        <!-- name and role -->
        <h2 id="name">Jennie Kim</h2>
        <p id="role">Artist</p>

        <!-- additional details -->
        <div id="details">
            <p id="email">Email: liseuxdenini@gmail.com</p>
            <p id="address">Address: Seoul, South Korea</p>
        </div>

        <!-- buttons -->
        <div class="controls">
            <button id="toggleBtn">Show Details</button>
            <button id="changeBtn">Change Profile</button>
        </div>

        <!-- Added buttons for changing colors -->
        <div class="color-buttons">
            <button id="randomCardColor">Change Card Color</button>
            <button id="randomPageColor">Change Page Color</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
